<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Конструктор моря</title>
<style>
  :root { --bg: #15191d; --panel: #1f252b; --line: #333c44; --text: #dfe6ec; --dim: #8b98a5; --acc: #ffcc33; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.35 system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 8px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .grp { display: flex; gap: 4px; align-items: center; }
  button, select, input[type=number] { background: #2b333b; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; font: inherit; cursor: pointer; }
  input[type=number] { width: 76px; cursor: text; padding: 3px 6px; }
  button:hover { border-color: #56636f; }
  button.on { background: var(--acc); color: #111; border-color: var(--acc); font-weight: 600; }
  button.go { background: #2f7d3a; border-color: #3d9b4a; font-weight: 600; }
  label { color: var(--dim); }
  main { flex: 1; display: flex; min-height: 0; }
  #wrap { flex: 1; position: relative; min-width: 0; overflow: hidden; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; }
  #gameBox { position: absolute; left: 10px; top: 10px; width: 960px; height: 540px; }
  #ifr { position: absolute; inset: 0; width: 960px; height: 540px; border: 0; background: #000; }
  #ov { position: absolute; inset: 0; width: 960px; height: 540px; cursor: default; }
  aside { width: 400px; max-width: 42vw; border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; gap: 8px; padding: 10px; overflow: auto; }
  #pv { width: 100%; aspect-ratio: 16 / 10; background: #26343c; border-radius: 6px; }
  .list div { display: flex; gap: 6px; align-items: center; padding: 2px 0; }
  .row { display: grid; grid-template-columns: 1fr 120px 52px; gap: 6px; align-items: center; padding: 3px 0; border-bottom: 1px solid #262d33; }
  .row span { color: var(--dim); font-size: 12px; }
  .row b { font-weight: 500; }
  #status { color: var(--dim); white-space: pre-wrap; font: 12px/1.3 ui-monospace, monospace; max-height: 150px; overflow: auto; }
  .hint { color: var(--dim); font-size: 12px; }
  .hint b { color: var(--text); }
  h4 { margin: 8px 0 2px; color: var(--acc); font-weight: 600; }
</style>
</head>

    <button data-t="scene">🌊 Сцена</button>

  if (u.t === 'mask') { Lr[u.k].mask.getContext('2d').putImageData(u.m, 0, 0); Lr[u.k].add.getContext('2d').putImageData(u.a, 0, 0); dirty.add(u.k + '_erase'); if (!Lr[u.k].asset) dirty.add(u.k + '_add'); compose(u.k); }
  else if (u.t === 'lay') { const d = JSON.parse(u.data); for (const k of Object.keys(d)) LAY[k] = d[k]; buildSide(); }
  else OV = JSON.parse(u.data);
  draw();
}
cv.addEventListener('mousedown', (e) => {
  const p = toC(e);
  if (e.button === 1 || space) { drag = { pan: true, x: e.clientX, y: e.clientY }; return; }
  if (tab === 'art') { if (!Lr[active]) return; pushUndo('mask'); drag = { paint: e.button === 0, last: p }; stroke(p, p, drag.paint); draw(); return; }
  if (tab === 'rig' && rmode === 'joints') { const k = nearest(Object.keys(S.J).filter((k) => Array.isArray(J(k))).map((k) => [k, J(k)]), p, 14 / view.s); if (k && e.button === 0) { pushUndo('ov'); drag = { joint: k }; } return; }
  if (tab === 'rig' && rmode === 'regions') {
    const sel = $('reg').value, pts = R(sel).map((q) => q.slice()), i = nearest(pts.map((q, i) => [i, q]), p, 12 / view.s);
    if (i !== null && e.button === 2) { if (pts.length > 3) { pushUndo('ov'); pts.splice(i, 1); OV.R[sel] = pts; draw(); } return; }
    if (i !== null && e.button === 0) { pushUndo('ov'); OV.R[sel] = pts; drag = { reg: sel, i }; }
  }
});
cv.addEventListener('dblclick', (e) => {
  if (tab !== 'rig' || rmode !== 'regions') return;
  const p = toC(e), sel = $('reg').value, pts = R(sel).map((q) => q.slice()); let bi = 0, bd = 1e9;
  for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length], vx = b[0] - a[0], vy = b[1] - a[1], t = Math.max(0, Math.min(1, ((p[0] - a[0]) * vx + (p[1] - a[1]) * vy) / (vx * vx + vy * vy || 1))), d = Math.hypot(a[0] + vx * t - p[0], a[1] + vy * t - p[1]); if (d < bd) { bd = d; bi = i; } }
  pushUndo('ov'); pts.splice(bi + 1, 0, [Math.round(p[0]), Math.round(p[1])]); OV.R[sel] = pts; draw();
});
cv.addEventListener('mousemove', (e) => {
  const p = toC(e); hover = p;
  if (drag && drag.pan) { view.x += e.clientX - drag.x; view.y += e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY; }
  else if (drag && drag.last) { stroke(drag.last, p, drag.paint); drag.last = p; }
  else if (drag && drag.joint) OV.J[drag.joint] = [Math.round(p[0]), Math.round(p[1])];
  else if (drag && drag.reg) OV.R[drag.reg][drag.i] = [Math.round(p[0]), Math.round(p[1])];
  draw();
});
addEventListener('mouseup', () => { drag = null; sdrag = null; });

// ---------------- игра в iframe (Сцена, Атаки, превью поз) ----------------
const ifr = $('ifr'), ov = $('ov'), og = ov.getContext('2d');
let W = null;
function loadGame() {
  return new Promise((ok) => {
    W = null; ifr.onload = async () => {
      const w = ifr.contentWindow, ready = () => { try { return w.eval("typeof L10 !== 'undefined' && L10.PARTS && L10.PARTS.sea && !!L10.PARTS.sea.R && !!L10.img.rig30"); } catch (e) { return false; } };
      for (let i = 0; i < 200 && !ready(); i++) await new Promise((r) => setTimeout(r, 250));
      W = { w, L10: w.eval('L10'), P: w.eval('L10.PARTS.sea') }; LAY = W.L10.SEA3; W.L10._skin3 = undefined; W.P.freeze = $('freeze').checked; buildSide(); ok();
    };
    ifr.src = '/?l10=sea&seaedit=1&t=' + Date.now();
  });
}
// пересчёт координат: игровой холст 640x360 внутри iframe
function gameRect() { try { const c = W.w.document.querySelector('canvas'), r = c.getBoundingClientRect(); return { x: r.left, y: r.top, k: r.width / 640 }; } catch (e) { return { x: 0, y: 0, k: 1.5 }; } }
const toG = (e) => { const b = ov.getBoundingClientRect(), g = gameRect(); return [(e.clientX - b.left - g.x) / g.k, (e.clientY - b.top - g.y) / g.k]; };
const fromG = (x, y) => { const g = gameRect(); return [g.x + x * g.k, g.y + y * g.k]; };
function handles() {
  if (!W || !LAY) return [];
  const H = [], L = LAY, k = L.sem.H / 236;
  L.stations.forEach((s, i) => { const hw = 273 * s.s * 0.5, hh = 330 * s.s * 0.5; H.push({ k: 'st', i, box: [s.x - hw, s.y - hh, hw * 2, hh] }); });
  L.legA.forEach((q, i) => H.push({ k: 'leg', i, pt: [L.sem.x + q[0] * k, L.sem.y + q[1] * k] }));
  H.push({ k: 'raft', pt: [Math.max(L.raftX0, 6), L.WY] });
  H.push({ k: 'wy', line: L.WY }); H.push({ k: 'sea', line: (L.bg || {}).seaY ?? 150 });
  try { const b = W.P.R.box(); H.push({ k: 'sem', box: b }); } catch (e) {}
  return H;
}
function hit(p) {
  for (const h of handles()) {
    if (h.pt && Math.hypot(h.pt[0] - p[0], h.pt[1] - p[1]) < 9) return h;
  }
  for (const h of handles()) if (h.box && h.k === 'st' && p[0] > h.box[0] && p[0] < h.box[0] + h.box[2] && p[1] > h.box[1] && p[1] < h.box[1] + h.box[3]) return h;
  for (const h of handles()) if (h.line != null && Math.abs(p[1] - h.line) < 4) return h;
  for (const h of handles()) if (h.box && h.k === 'sem' && p[0] > h.box[0] && p[0] < h.box[0] + h.box[2] && p[1] > h.box[1] && p[1] < h.box[1] + h.box[3]) return h;
  return null;
}
let sdrag = null, shover = null;
ov.addEventListener('mousedown', (e) => { if (tab !== 'scene') return; const p = toG(e), h = hit(p); if (!h) return; pushUndo('lay'); sdrag = { h, p0: p, L0: JSON.parse(JSON.stringify(LAY)) }; });
ov.addEventListener('mousemove', (e) => {
  const p = toG(e); shover = hit(p);
  if (!sdrag) return; const { h, p0, L0 } = sdrag, dx = p[0] - p0[0], dy = p[1] - p0[1], L = LAY, R = (v) => Math.round(v);
  if (h.k === 'sem') { L.sem.x = R(L0.sem.x + dx); L.sem.y = R(L0.sem.y + dy); }
  if (h.k === 'st') { L.stations[h.i].x = R(L0.stations[h.i].x + dx); L.stations[h.i].y = R(L0.stations[h.i].y + dy); }
  if (h.k === 'leg') { const k = L.sem.H / 236; L.legA[h.i] = [R(L0.legA[h.i][0] + dx / k), R(L0.legA[h.i][1] + dy / k)]; }
  if (h.k === 'raft') L.raftX0 = R(Math.min(300, L0.raftX0 + dx));
  if (h.k === 'wy') L.WY = R(L0.WY + dy);
  if (h.k === 'sea') { L.bg = L.bg || {}; L.bg.seaY = R((L0.bg || {}).seaY ?? 150) + R(dy); }
  buildSide();
});
ov.addEventListener('wheel', (e) => {
  if (tab !== 'scene') return; e.preventDefault(); const h = hit(toG(e)); if (!h) return; const k = Math.exp(-e.deltaY * 0.001);
  pushUndo('lay'); if (h.k === 'sem') LAY.sem.H = Math.round(LAY.sem.H * k); if (h.k === 'st') LAY.stations[h.i].s = +(LAY.stations[h.i].s * k).toFixed(3); buildSide();
}, { passive: false });
function drawOverlay() {
  og.clearRect(0, 0, 960, 540); if (tab !== 'scene' || !W) return;
  const g = gameRect(); og.save(); og.translate(g.x, g.y); og.scale(g.k, g.k); og.lineWidth = 1.5 / g.k * 1.5;
  for (const h of handles()) {
    const on = shover && shover.k === h.k && shover.i === h.i;
    if (h.line != null) { og.strokeStyle = h.k === 'wy' ? '#5ac8ff' : '#ffd84a'; og.setLineDash(on ? [] : [6, 4]); og.beginPath(); og.moveTo(0, h.line); og.lineTo(640, h.line); og.stroke(); og.setLineDash([]); og.fillStyle = og.strokeStyle; og.font = '9px system-ui'; og.fillText(h.k === 'wy' ? 'вода у плотов' : 'горизонт моря', 4, h.line - 3); }
    if (h.box) { og.strokeStyle = h.k === 'sem' ? (on ? '#ff8a3a' : 'rgba(255,138,58,0.6)') : (on ? '#7dff7a' : 'rgba(125,255,122,0.6)'); og.strokeRect(h.box[0], h.box[1], h.box[2], h.box[3]); }
    if (h.pt) { og.fillStyle = h.k === 'raft' ? '#3dff8a' : '#ff6bd5'; og.beginPath(); if (h.k === 'raft') { og.moveTo(h.pt[0], h.pt[1] - 7); og.lineTo(h.pt[0] + 7, h.pt[1]); og.lineTo(h.pt[0], h.pt[1] + 7); og.lineTo(h.pt[0] - 7, h.pt[1]); } else og.arc(h.pt[0], h.pt[1], on ? 6 : 4.5, 0, 7); og.fill(); }
  }
  og.restore();
}

// ---------------- боковая панель ----------------
const getP = (o, path) => path.split('.').reduce((a, k) => a && a[k], o);
const setP = (o, path, v) => { const ks = path.split('.'), last = ks.pop(), t = ks.reduce((a, k) => a[k], o); t[last] = v; };
function buildSide() {
  const box = $('side');
  if (tab === 'art') {
    box.innerHTML = '<h4>Какой слой правим</h4><div class="list" id="lst"></div>';
    for (const k of Object.keys(Lr)) { const d = document.createElement('div'); d.innerHTML = `<label style="color:var(--text);cursor:pointer;display:flex;gap:6px;align-items:center"><input type="radio" name="act" ${k === active ? 'checked' : ''}>${LNAME[k] || k}</label>`; d.querySelector('input').onchange = () => { active = k; fit(); }; $('lst').appendChild(d); }
  } else if (tab === 'scene') {
    if (!LAY) { box.innerHTML = 'Игра загружается…'; return; }
    const L = LAY, f = (path, name) => `<div class="row"><span>${name}</span><input type="number" step="any" data-p="${path}" value="${getP(L, path)}"><span></span></div>`;
    box.innerHTML = '<h4>Положения (можно и числами)</h4>' + f('sem.x', 'Семён: X') + f('sem.y', 'Семён: линия воды Y') + f('sem.H', 'Семён: высота над водой') + f('WY', 'Вода у плотов Y') + f('bg.seaY', 'Горизонт моря Y') + f('bg.seaH', 'Высота моря') + f('bg.ships', 'Кораблей на фоне') + f('raftX0', 'Плоты выплывают с X')
      + L.stations.map((s, i) => f(`stations.${i}.x`, `Станция ${i + 1}: X`) + f(`stations.${i}.y`, `Станция ${i + 1}: Y`) + f(`stations.${i}.s`, `Станция ${i + 1}: масштаб`)).join('')
      + L.legA.map((q, i) => f(`legA.${i}.0`, `Лапа ${i + 1}: X от Семёна`) + f(`legA.${i}.1`, `Лапа ${i + 1}: Y от воды`)).join('');
    box.querySelectorAll('input').forEach((inp) => inp.onchange = () => { pushUndo('lay'); setP(LAY, inp.dataset.p, +inp.value); });
  } else if (tab === 'atk') {
    if (!LAY) { box.innerHTML = 'Игра загружается…'; return; }
    let h = '<h4>Показать в игре</h4><div class="grp" style="flex-wrap:wrap">' + ['plasma', 'laser', 'hose', 'clap'].map((k) => `<button data-a="${k}">${{ plasma: 'Плазма', laser: 'Лазер', hose: 'Шланг', clap: 'Хлопок' }[k]}</button>`).join('') + '</div>'
      + '<div class="grp" style="margin-top:4px"><label>Сегмент</label>' + [0, 1, 2].map((i) => `<button data-seg="${i}">${i + 1}</button>`).join('') + '<button data-auto="1">авто-бой</button></div>';
    for (const s of SL) {
      if (s[0] === 'h') { h += `<h4>${s[1]}</h4>`; continue; }
      const v = getP(LAY, s[0]); h += `<div class="row"><span>${s[1]}</span><input type="range" min="${s[2]}" max="${s[3]}" step="${s[4]}" value="${v}" data-p="${s[0]}"><b>${v}</b></div>`;
    }
    box.innerHTML = h;
    box.querySelectorAll('input[type=range]').forEach((inp) => inp.oninput = () => { setP(LAY, inp.dataset.p, +inp.value); inp.nextElementSibling.textContent = inp.value; if (inp.dataset.p === 'hp' && W) { W.P.B.maxHp = +inp.value; W.P.B.segHp = W.P.B.maxHp / W.P.B.segs; W.P.B.hp = Math.min(W.P.B.hp, W.P.B.maxHp); } });
    box.querySelectorAll('[data-a]').forEach((b) => b.onclick = () => { if (W) W.P.startAtk(b.dataset.a); });
    box.querySelectorAll('[data-seg]').forEach((b) => b.onclick = () => { if (W) { const B = W.P.B; B.hp = B.maxHp - (+b.dataset.seg) * B.segHp - 1; } });
    box.querySelectorAll('[data-auto]').forEach((b) => b.onclick = () => { if (W) { W.P.edit = !W.P.edit; if (!W.P.edit) W.P.A.cd = 1; b.classList.toggle('on', !W.P.edit); log(W.P.edit ? 'Атаки — только по кнопкам.' : 'Авто-бой: Семён атакует сам (Валера всё равно бессмертен? нет — может погибнуть).'); } });
  } else if (tab === 'rig') {
    box.innerHTML = '<h4>Суставы и области рига анфас</h4><div class="hint">Изменённые суставы — красные. Чтобы вернуть сустав как было, выбери его и нажми «Сбросить сустав».</div><div class="grp"><select id="jsel"></select><button id="jreset">Сбросить сустав</button></div>';
    const js = $('jsel'); for (const k of Object.keys(OV.J)) js.add(new Option(k, k)); $('jreset').onclick = () => { if (js.value) { pushUndo('ov'); delete OV.J[js.value]; buildSide(); draw(); } };
  }
}

// ---------------- превью поз рига (для «Арт» и «Риг») ----------------
const pv = $('pv'), pg = pv.getContext('2d');
POSES.forEach((p) => $('pose').add(new Option(POSEN[p], p)));
let PB = null, pt = 0, poseI = 0;
const pre = { clap: 'clapOut', hoseHit: 'hoseUp' };
function tick() {
  requestAnimationFrame(tick); drawOverlay();
  if (!W || (tab !== 'art' && tab !== 'rig')) return;
  try {
    if (!PB) { PB = new W.L10.RigFront({ x: 320, y: 300, H: 260 }); PB.watch = { x: 420, y: 300 }; PB.gunT = { x: 150, y: 300 }; PB.aimL = [316, 302]; PB.aimR = [324, 302]; PB.hoseT = { x: 470, y: 305 }; }
    const sel = $('pose').value, list = POSES.slice(1), want = sel === 'cycle' ? list[poseI % list.length] : sel;
    pt += 1 / 60; if (pt > 1.8) { pt = 0; if (sel === 'cycle') poseI++; if (want === 'gun') PB.fireGun(); }
    PB.setPose(pre[want] && pt < 0.9 ? pre[want] : want); PB.shield = want === 'connect' ? 1 : 0; PB.update(1 / 60);
    const t = newCanvas(640, 360), tg = t.getContext('2d'); PB.draw(tg);
    pg.fillStyle = '#26343c'; pg.fillRect(0, 0, 640, 400); pg.drawImage(t, 80, 10, 480, 300, 0, 0, 640, 400);
    pg.fillStyle = 'rgba(20,70,110,0.75)'; pg.fillRect(0, (300 - 10) * 400 / 300, 640, 400); pg.fillStyle = '#ff0'; pg.font = '20px system-ui'; pg.fillText(POSEN[want], 10, 26);
  } catch (e) { PB = null; }
}

// ---------------- вкладки и кнопки ----------------
function setTab(t) {
  tab = t; document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.t === t));
  const game = t === 'scene' || t === 'atk';
  $('gameBox').hidden = !game; cv.style.display = game ? 'none' : ''; $('artGrp').hidden = t !== 'art'; $('rigGrp').hidden = t !== 'rig'; $('sceneGrp').hidden = t !== 'scene'; $('pvBox').hidden = game; $('fit').hidden = game;
  ov.style.pointerEvents = t === 'scene' ? 'auto' : 'none';
  $('help').innerHTML = HELP[t]; buildSide(); if (!game) { resize(); fit(); }
}
document.querySelectorAll('#tabs button').forEach((b) => b.onclick = () => setTab(b.dataset.t));
document.querySelectorAll('#artGrp [data-m]').forEach((b) => b.onclick = () => { amode = b.dataset.m; document.querySelectorAll('#artGrp [data-m]').forEach((x) => x.classList.toggle('on', x === b)); draw(); });
document.querySelectorAll('#rigGrp [data-r]').forEach((b) => b.onclick = () => { rmode = b.dataset.r; document.querySelectorAll('#rigGrp [data-r]').forEach((x) => x.classList.toggle('on', x === b)); draw(); });
$('brush').oninput = (e) => { $('brushV').textContent = e.target.value; draw(); };
$('freeze').onchange = () => { if (W) W.P.freeze = $('freeze').checked; };
$('undo').onclick = doUndo; $('fit').onclick = fit;
const maskEmpty = (c) => { const d = c.getContext('2d').getImageData(0, 0, c.width, c.height).data; for (let i = 3; i < d.length; i += 4) if (d[i] > 0) return false; return true; };
async function save() {
  const masks = {};
  for (const key of dirty) { const add = key.endsWith('_add'), k = key.replace(/_(add|erase)$/, ''), c = add ? Lr[k].add : Lr[k].mask; masks[key] = maskEmpty(c) ? null : c.toDataURL('image/png'); }
  const j = await (await fetch(SRV + '/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ layout: LAY, overrides: OV, masks }) })).json();
  if (!j.ok) throw new Error(j.log); dirty.clear();
}
$('build').onclick = async () => {
  try {
    log('Сохраняю…'); await save(); log('Собираю (риг, станции, сжатие картинок) — около минуты…');
    const j = await (await fetch(SRV + '/build', { method: 'POST' })).json();
    if (!j.ok) { log('Сборка упала:\n' + j.log); return; }
    log('Версия ' + j.ver + '. Перезапускаю игру…'); PB = null; await loadState(true); await loadGame(); draw(); log('Готово! Всё сохранено, игра слева/справа уже новая. В обычной игре нажми F5.');
  } catch (e) { log('Ошибка: ' + e.message + '\nЗакрой окно и запусти «Конструктор моря.bat» ещё раз.'); }
};
addEventListener('resize', resize);
(async () => {
  $('help').innerHTML = HELP.art;
  await loadState(false); resize(); fit(); log('Загружаю игру…');
  await loadGame(); log('Готово к работе.'); requestAnimationFrame(tick);
})();
</script>
