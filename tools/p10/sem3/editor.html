<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Редактор фазы 3</title>
<style>
  :root { --bg: #15191f; --pan: #1f252e; --line: #323b48; --tx: #e4e8ee; --dim: #8b96a6; --acc: #ffcc33; --go: #3fbf6a; --bad: #e0573e; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--tx); font: 13px/1.35 system-ui, Segoe UI, sans-serif; overflow: hidden; }
  #top { display: flex; gap: 8px; align-items: center; padding: 6px 10px; background: var(--pan); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  #top h1 { font-size: 15px; margin: 0 10px 0 0; color: var(--acc); }
  button, select, input { font: inherit; color: var(--tx); background: #2a323d; border: 1px solid var(--line); border-radius: 5px; padding: 4px 8px; }
  button { cursor: pointer; } button:hover { border-color: #5a6a80; } button.on { background: #4a3d10; border-color: var(--acc); color: var(--acc); }
  button.go { background: #1d4a2c; border-color: var(--go); } button.bad { border-color: var(--bad); color: #ffb3a3; }
  input[type=range] { padding: 0; width: 130px; } input[type=number] { width: 70px; } input[type=checkbox] { width: auto; }
  #main { position: absolute; top: 44px; bottom: 0; left: 0; right: 0; display: flex; }
  #side { width: 330px; min-width: 330px; overflow-y: auto; background: var(--pan); border-right: 1px solid var(--line); padding: 8px 10px 40px; }
  #side h4 { margin: 12px 0 5px; color: var(--acc); font-size: 13px; }
  #side .hint { color: var(--dim); font-size: 12px; margin: 4px 0; }
  .row { display: flex; align-items: center; gap: 6px; margin: 3px 0; } .row > span:first-child { flex: 0 0 110px; color: var(--dim); }
  .grp { display: flex; gap: 4px; flex-wrap: wrap; margin: 4px 0; }
  #work { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #stage { flex: 1; position: relative; min-height: 0; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; }
  #tl { height: 92px; border-top: 1px solid var(--line); background: #11151a; position: relative; }
  #tlc { width: 100%; height: 100%; display: block; cursor: pointer; }
  #game { position: absolute; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; }
  #game iframe { width: 100%; height: 100%; border: 0; }
  #ov { position: absolute; inset: 0; width: 100%; height: 100%; }
  .list { max-height: 300px; overflow-y: auto; border: 1px solid var(--line); border-radius: 5px; }
  .list div { padding: 3px 6px; cursor: pointer; display: flex; gap: 6px; align-items: center; white-space: nowrap; }
  .list div:hover { background: #2a323d; } .list div.sel { background: #4a3d10; color: var(--acc); }
  .list .eye { opacity: .7; cursor: pointer; width: 16px; text-align: center; } .list .tag { color: var(--dim); font-size: 11px; margin-left: auto; }
  #status { margin-left: auto; color: var(--dim); max-width: 520px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #hint { position: absolute; left: 8px; bottom: 6px; color: var(--dim); font-size: 12px; pointer-events: none; background: #0008; padding: 3px 7px; border-radius: 4px; }
  .chk { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 2px 6px; max-height: 170px; overflow-y: auto; border: 1px solid var(--line); border-radius: 5px; padding: 4px; }
  .chk label { white-space: nowrap; font-size: 12px; }
</style>
</head>
<body>
<div id="top">
  <h1>Редактор фазы 3 «Море»</h1>
  <div class="grp" id="tabs">
    <button data-t="parts" class="on">🖼️ Части</button>
    <button data-t="bones">🦴 Кости</button>
    <button data-t="anim">🎬 Анимации</button>
    <button data-t="scene">🌊 Сцена</button>
    <button data-t="img">🖌️ Картинки</button>
  </div>
  <button id="undo" title="Ctrl+Z">↶ Отменить</button>
  <button id="fit">⤢ Целиком</button>
  <button id="save" class="go">✅ Сохранить и посмотреть</button>
  <span id="status">Загрузка…</span>
</div>
<div id="main">
  <div id="side"></div>
  <div id="work">
    <div id="stage"><canvas id="cv"></canvas><div id="hint"></div><div id="game" hidden><iframe id="ifr"></iframe><canvas id="ov"></canvas></div></div>
    <div id="tl" hidden><canvas id="tlc"></canvas></div>
  </div>
</div>
<input type="file" id="fAdd" accept="image/png,image/jpeg,image/webp" multiple hidden>
<input type="file" id="fRep" accept="image/png,image/jpeg,image/webp" hidden>
<input type="file" id="fTrace" accept="image/png,image/jpeg,image/webp" hidden>
<script>window.L10 = {};</script>
<script>
// ======================= Редактор Семёна (фаза 3) =======================
// Данные: js/sem3_data.js (L10.SEM3), картинки частей: assets/l10/sem3/*.png. Рисует тот же движок, что игра (js/level10sem3.js).
const ROOT = '../../../', SRV = 'http://localhost:18803', $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d'), tlc = $('tlc'), tctx = tlc.getContext('2d');
let D = null, Core = null, R = null, IMG = {}, ORIG = {}, dirty = new Set(), needPrep = true;
let tab = 'parts', view = { k: 0.5, ox: 300, oy: 40 }, dpr = 1;
let selPart = null, selBone = null, selPt = null, mode = 'move', brush = 24, cutMode = 'trace';
let aMode = 'rot', clip = 'idle', T = 0, playing = false, live = false, liveSem = null, copyPose = null, ikView = true;
let TRACE = null, lasso = null, mouse = [0, 0], undoSt = [], drag = null, addBone = null;
const status = (s, bad) => { $('status').textContent = s; $('status').style.color = bad ? 'var(--bad)' : 'var(--dim)'; };
const hint = s => $('hint').textContent = s;
const r1 = x => Math.round(x * 10) / 10, r3 = x => Math.round(x * 1000) / 1000;

// ---------- загрузка ----------
async function loadScript(url) { const t = await (await fetch(url + '?' + Date.now())).text(); new Function('L10', t)(window.L10); }
function toCanvas(img, w, h) { const c = document.createElement('canvas'); c.width = w || img.naturalWidth || img.width; c.height = h || img.naturalHeight || img.height; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); return c; }
function loadImg(src) { return new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = src; }); }
async function boot() {
  await loadScript(ROOT + 'js/level10sem3.js'); await loadScript(ROOT + 'js/sem3_data.js');
  Core = L10.Sem3Core; D = JSON.parse(JSON.stringify(L10.SEM3));
  for (const n of new Set(D.parts.map(p => p.img))) {
    try { const i = await loadImg(ROOT + 'assets/l10/sem3/' + n + '.png?' + Date.now()); IMG[n] = toCanvas(i); ORIG[n] = toCanvas(i); }
    catch (e) { status('Нет картинки ' + n, 1); }
  }
  resize(); fit(); buildSide(); status('Готово. Части: ' + D.parts.length + ', костей: ' + D.bones.length);
  requestAnimationFrame(loop);
}
function prep() { if (needPrep) { Core.dropTex(R); R = Core.prep(D, n => IMG[n]); needPrep = false; liveSem = null; } return R; }
function changed() { needPrep = true; }

// ---------- вид ----------
function resize() { dpr = window.devicePixelRatio || 1; const r = cv.getBoundingClientRect(); cv.width = r.width * dpr; cv.height = r.height * dpr; const t = tlc.getBoundingClientRect(); tlc.width = t.width * dpr; tlc.height = t.height * dpr; }
window.addEventListener('resize', resize);
function fit() { const r = cv.getBoundingClientRect(), h = (D.water - D.top) * 1.9, w = D.size[0] * 1.6; view.k = Math.min(r.height / h, r.width / w); view.ox = r.width / 2 - D.cx * view.k; view.oy = r.height * 0.12 - (D.top - 120) * view.k; }
const toS = p => [p[0] * view.k + view.ox, p[1] * view.k + view.oy], toM = p => [(p[0] - view.ox) / view.k, (p[1] - view.oy) / view.k];

// ---------- поза на экране ----------
function curPose() {
  prep(); const st = { ch: {}, vars: {} }; let pose = {};
  if (tab !== 'anim') { const p = selPart; if (p) { if (p.show === 'mouth') st.ch.mouth = 1; if (p.show === 'eye') st.ch.eye = 1; if (p.grp) st.vars[p.grp] = p.var; } return { pose, st, M: Core.mats(R, pose) }; }
  const c = D.clips[clip];
  if (clip[0] === '+') { Core.sample(D.clips.idle, 0, pose, st); Core.sample(c, T, pose, st, 1, true); const m = c.c || {}; for (const k in m) st.ch[k] = Core.keyAt(m[k], T, c.len, c.loop)[1]; }
  else pose = Core.base(D, clip === 'idle' ? T : 0, clip, T, st);
  const ik = (c.f || {}).ik; if (ik && ikView && !(drag && drag.fn)) for (const sd of ['L', 'R']) { if (!ik.includes(sd)) continue; const ch = (D.roles || {})['arm' + sd]; if (!ch || ch.length < 2 || !R.B[ch[ch.length - 1]]) continue;     // как в игре: кисти к цели перед животом
    const end = R.B[ch[ch.length - 1]], tq = [D.cx + (sd === 'L' ? -150 : 150), D.water - 245]; Core.ccd(R, pose, ch.slice(0, -1), [end.x, end.y], tq, 6); }
  return { pose, st, M: Core.mats(R, pose) };
}

// ---------- главный цикл ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (D && tab === 'scene') drawOverlay();
  else if (D && tab === 'img') { const rc = cv.getBoundingClientRect(); if (Math.round(rc.width * dpr) !== cv.width || Math.round(rc.height * dpr) !== cv.height) resize(); if (ED && !ED.view) edFit(); drawImgTab(); }
  else if (D) {
    const rc = cv.getBoundingClientRect(); if (Math.round(rc.width * dpr) !== cv.width || Math.round(rc.height * dpr) !== cv.height || tab === 'anim' && tlc.width < 10) resize();
    if (!(view.k > 0) && rc.width > 10) fit();
    if (playing) { const c = D.clips[clip]; T += dt; if (T > c.len) T = c.loop ? T % c.len : (playing = false, c.len); }
    draw(dt); if (tab === 'anim') drawTL();
  }
  requestAnimationFrame(loop);
}
function draw(dt) {
  const W = cv.width / dpr, H = cv.height / dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.fillStyle = '#1a2028'; ctx.fillRect(0, 0, W, H);
  // вода и верх
  const wy = toS([0, D.water])[1], ty = toS([0, D.top])[1];
  ctx.fillStyle = 'rgba(30,90,140,0.35)'; ctx.fillRect(0, wy, W, H - wy);
  ctx.setLineDash([6, 5]); ctx.strokeStyle = '#5ab0ff'; ctx.beginPath(); ctx.moveTo(0, wy); ctx.lineTo(W, wy); ctx.stroke();
  ctx.strokeStyle = '#ffffff40'; ctx.beginPath(); ctx.moveTo(0, ty); ctx.lineTo(W, ty); const cx = toS([D.cx, 0])[0]; ctx.moveTo(cx, 0); ctx.lineTo(cx, H); ctx.stroke(); ctx.setLineDash([]);
  if (TRACE && TRACE.under) drawTrace();
  const { pose, st, M } = curPose();
  if (tab === 'anim' && live) {
    if (!liveSem) { liveSem = new L10.Sem3({ D, img: n => IMG[n] }); liveSem.R = R; liveSem.gunK = 1; }
    const s = liveSem, m = mouse; s.x = view.ox + D.cx * view.k; s.y = view.oy + D.water * view.k; s.H = view.k * (D.water - D.top);
    s.setPose(clip[0] === '+' ? 'idle' : clip); if (clip === '+mouth') s.ovr = { mouth: 1 }; else if (clip === '+eye') s.ovr = { eye: 1 }; else if (clip === '+legs') s.ovr = { legs: 1 }; else s.ovr = {};
    s.watch = { x: m[0], y: m[1] }; s.aimL = [m[0] - 30, m[1]]; s.aimR = [m[0] + 30, m[1]]; s.hoseT = { x: m[0], y: m[1] }; s.gunT = { x: m[0], y: m[1] };
    s.update(dt); s.draw(ctx);
  } else {
    ctx.setTransform(dpr * view.k, 0, 0, dpr * view.k, dpr * view.ox, dpr * view.oy); ctx.imageSmoothingQuality = 'high';
    Core.draw(ctx, R, M, Core.ID, st, { alpha: p => p._hide ? 0 : (tab === 'parts' && selPart && $('solo') && $('solo').checked && p !== selPart ? 0.25 : 1) });
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  if (TRACE && !TRACE.under) drawTrace();
  overlay(M);
}
function drawTrace() { const t = TRACE, a = toS([t.x, t.y]); ctx.save(); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.globalAlpha = t.a; ctx.drawImage(t.img, a[0], a[1], t.img.width * t.s * view.k, t.img.height * t.s * view.k); ctx.restore(); }
function boneScr(M, id) { const b = R.B[id]; return [toS(Core.ap(M[id], [b.x, b.y])), toS(Core.ap(M[id], b.t))]; }
function overlay(M) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (tab === 'parts' && selPart) partOutline(selPart, M);
  const showB = tab === 'bones' || tab === 'anim' || (tab === 'parts' && $('showB') && $('showB').checked);
  if (showB) for (const id of R.order) {
    const [p, q] = boneScr(M, id), sel = id === selBone, inSkin = tab === 'parts' && selPart && (selPart.mode === 'skin' ? (selPart.skin || []).includes(id) : selPart.bone === id);
    const a = Math.atan2(q[1] - p[1], q[0] - p[0]), w = Math.min(9, Math.hypot(q[0] - p[0], q[1] - p[1]) * 0.14 + 2);
    ctx.fillStyle = sel ? 'rgba(255,204,51,0.75)' : inSkin ? 'rgba(80,255,140,0.6)' : 'rgba(170,200,255,0.35)';
    ctx.strokeStyle = sel ? '#ffcc33' : '#cfe0ff'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(p[0] + Math.cos(a + 1.57) * w, p[1] + Math.sin(a + 1.57) * w); ctx.lineTo(q[0], q[1]); ctx.lineTo(p[0] + Math.cos(a - 1.57) * w, p[1] + Math.sin(a - 1.57) * w); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(p[0], p[1], sel ? 5 : 3.5, 0, 7); ctx.fillStyle = sel ? '#ffcc33' : '#fff'; ctx.fill();
    if (tab === 'bones' && sel) { ctx.beginPath(); ctx.arc(q[0], q[1], 4, 0, 7); ctx.strokeStyle = '#ff7a3a'; ctx.lineWidth = 2; ctx.stroke(); }
    if (tab === 'bones' && $('names') && $('names').checked) { ctx.fillStyle = '#fff'; ctx.font = '11px system-ui'; ctx.fillText(id, p[0] + 5, p[1] - 4); }
  }
  if (tab === 'bones') for (const k in D.pts || {}) {
    const q = D.pts[k], b = R.B[q.b]; if (!b) continue; const s = toS(Core.ap(M[q.b], [q.x, q.y])), sel = k === selPt;
    ctx.fillStyle = sel ? '#ffcc33' : '#ff5ad0'; ctx.beginPath(); ctx.moveTo(s[0], s[1] - 6); ctx.lineTo(s[0] + 6, s[1]); ctx.lineTo(s[0], s[1] + 6); ctx.lineTo(s[0] - 6, s[1]); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '11px system-ui'; ctx.fillText(PTN[k] || k, s[0] + 8, s[1] + 4);
  }
  if (lasso && lasso.length) { ctx.strokeStyle = '#ffcc33'; ctx.lineWidth = 1.5; ctx.beginPath(); lasso.forEach((p, i) => { const s = toS(p); i ? ctx.lineTo(s[0], s[1]) : ctx.moveTo(s[0], s[1]); }); const m = mouse; ctx.lineTo(m[0], m[1]); ctx.stroke(); }
  if (addBone && addBone.p) { const s = toS(addBone.p); ctx.strokeStyle = '#ffcc33'; ctx.beginPath(); ctx.moveTo(s[0], s[1]); ctx.lineTo(mouse[0], mouse[1]); ctx.stroke(); }
  if (tab === 'parts' && (mode === 'erase' || mode === 'restore')) { ctx.strokeStyle = mode === 'erase' ? '#ff7a3a' : '#5aff9a'; ctx.beginPath(); ctx.arc(mouse[0], mouse[1], brush * view.k * partScale(), 0, 7); ctx.stroke(); }
}
function partScale() { if (!selPart) return 1; return Math.hypot(selPart.sx ?? 1, 0) || 1; }
function partOutline(p, M) {
  const q = R.parts.find(x => x.p === p); if (!q) return; ctx.strokeStyle = '#ffcc33'; ctx.lineWidth = 1;
  if (q.T && $('mesh') && $('mesh').checked) { ctx.globalAlpha = 0.5; for (const t of q.T) { ctx.beginPath(); t.forEach((i, j) => { const s = toS(q.V[i]); j ? ctx.lineTo(s[0], s[1]) : ctx.moveTo(s[0], s[1]); }); ctx.closePath(); ctx.stroke(); } ctx.globalAlpha = 1; }
  const m = Core.mul(M[q.bone] || Core.ID, q.M), c = [[0, 0], [p.w, 0], [p.w, p.h], [0, p.h]].map(v => toS(Core.ap(q.T ? q.M : m, v)));
  ctx.setLineDash([5, 4]); ctx.beginPath(); c.forEach((s, i) => i ? ctx.lineTo(s[0], s[1]) : ctx.moveTo(s[0], s[1])); ctx.closePath(); ctx.stroke(); ctx.setLineDash([]);
}
const PTN = { e: 'глаз 1', e2: 'глаз 2', m: 'пасть', mg: 'дуло', gp: 'основание пушки', belly: 'пузо', legL: 'миньоны L', legR: 'миньоны R' };

// ---------- мышь ----------
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('wheel', e => { e.preventDefault(); const V = tab === 'img' ? ED && ED.view : view; if (!V) return; const m = [e.offsetX, e.offsetY], a = [(m[0] - V.ox) / V.k, (m[1] - V.oy) / V.k], f = Math.exp(-e.deltaY * 0.0015); V.k *= f; V.ox = m[0] - a[0] * V.k; V.oy = m[1] - a[1] * V.k; }, { passive: false });
cv.addEventListener('mousemove', e => { mouse = [e.offsetX, e.offsetY]; if (drag) dragMove(e); });
window.addEventListener('mouseup', () => { if (drag && drag.end) drag.end(); drag = null; });
cv.addEventListener('dblclick', e => { if (lasso && lasso.length > 2) finishLasso(); });
cv.addEventListener('mousedown', e => {
  const m = [e.offsetX, e.offsetY], a = toM(m); mouse = m;
  if (e.button === 1 || e.button === 2 || (e.button === 0 && e.getModifierState('Space'))) { const V = tab === 'img' ? ED && ED.view : view; if (!V) return; drag = { pan: 1, m0: m, V, o: { ox: V.ox, oy: V.oy } }; return; }
  if (tab === 'img') { imgDown(e, m); return; }
  if (lasso) { lasso.push(a); return; }
  if (addBone) { if (!addBone.p) addBone.p = a; else { finishAddBone(a); } return; }
  if (tab === 'parts') partsDown(e, m, a); else if (tab === 'bones') bonesDown(e, m, a); else if (tab === 'anim') animDown(e, m, a);
});
function dragMove(e) {
  const m = [e.offsetX, e.offsetY], a = toM(m);
  if (drag.pan) { drag.V.ox = drag.o.ox + m[0] - drag.m0[0]; drag.V.oy = drag.o.oy + m[1] - drag.m0[1]; return; }
  if (drag.fn) drag.fn(m, a, e);
}
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type !== 'range' && e.target.type !== 'checkbox') return;
  if ((e.ctrlKey || e.metaKey) && e.code === 'KeyZ') { e.preventDefault(); undo(); }
  else if (e.code === 'Escape') { lasso = null; addBone = null; hint(''); }
  else if (e.code === 'Enter' && lasso) finishLasso();
  else if (e.code === 'Space' && tab === 'anim' && e.target.tagName !== 'BUTTON') { e.preventDefault(); playing = !playing; buildSide(); }
});

// ---------- отмена ----------
function pushUndo(img) { const u = { json: JSON.stringify(D) }; if (img) u.img = { n: img, data: IMG[img].getContext('2d').getImageData(0, 0, IMG[img].width, IMG[img].height) }; undoSt.push(u); if (undoSt.length > 60) undoSt.shift(); }
function undo() {
  if (tab === 'img') { if (imgUndo()) { buildSide(); return status('Отменено'); } return status('Нечего отменять'); }
  const u = undoSt.pop(); if (!u) return status('Нечего отменять');
  if (u.lay) { if (LAY) applyLay(u.lay); return status('Отменено'); }
  const selP = selPart && D.parts.indexOf(selPart); D = JSON.parse(u.json);
  if (u.img) { const c = IMG[u.img.n]; if (c.width !== u.img.data.width) { c.width = u.img.data.width; c.height = u.img.data.height; } c.getContext('2d').putImageData(u.img.data, 0, 0); dirty.add(u.img.n); }
  selPart = selP != null && selP >= 0 ? D.parts[selP] || null : null; changed(); buildSide(); status('Отменено');
}
$('undo').onclick = undo; $('fit').onclick = fit;

// ======================= ЧАСТИ =======================
function partAt(a) {
  prep();
  for (let i = R.parts.length - 1; i >= 0; i--) {
    const q = R.parts[i], p = q.p; if (p._hide || !q.img) continue;
    if (p.grp && (R.grpDef[p.grp] !== p.var) && p !== selPart) continue;
    const l = Core.ap(Core.inv(q.M), a); if (l[0] < 0 || l[1] < 0 || l[0] >= p.w || l[1] >= p.h) continue;
    const c = IMG[p.img], kx = c.width / p.w, ky = c.height / p.h, px = c.getContext('2d').getImageData(l[0] * kx | 0, l[1] * ky | 0, 1, 1).data;
    if (px[3] > 20) return p;
  }
  return null;
}
function partsDown(e, m, a) {
  if (mode === 'trace' && TRACE) { const x0 = TRACE.x, y0 = TRACE.y; drag = { fn: (m2, a2) => { TRACE.x = x0 + a2[0] - a[0]; TRACE.y = y0 + a2[1] - a[1]; } }; return; }
  if ((mode === 'erase' || mode === 'restore') && selPart) {
    pushUndo(selPart.img); const p = selPart, c = IMG[p.img], g = c.getContext('2d'), kx = c.width / p.w;

    on('aBone', 'onchange', e => { selBone = e.target.value || null; buildSide(); }); on('aBr', 'oninput', e => { brush = +e.target.value; e.target.nextElementSibling.textContent = brush; });
    on('aPlay', 'onclick', () => { playing = !playing; buildSide(); }); on('aLive', 'onclick', () => { live = !live; liveSem = null; buildSide(); });
    on('aNew', 'onclick', () => { const n = (prompt('Имя новой анимации (латиницей). Копия текущей.', clip + '2') || '').replace(/[^A-Za-z0-9_+]/g, ''); if (!n || D.clips[n]) return; pushUndo(); D.clips[n] = JSON.parse(JSON.stringify(c)); clip = n; buildSide(); });
    on('aDelC', 'onclick', () => { if (CLIPN[clip]) return status('Эту анимацию вызывает игра — её нельзя удалить, можно очистить ключи.', 1); if (!confirm('Удалить ' + clip + '?')) return; pushUndo(); delete D.clips[clip]; clip = 'idle'; buildSide(); });
    on('aLen', 'onchange', e => { pushUndo(); c.len = Math.max(0.1, +e.target.value); T = Math.min(T, c.len); buildSide(); });
    on('aLoop', 'onchange', e => { pushUndo(); c.loop = e.target.checked ? 1 : 0; }); on('aFade', 'onchange', e => { pushUndo(); c.fade = Math.max(0, +e.target.value); });
    on('aT', 'oninput', e => { T = +e.target.value; playing = false; e.target.nextElementSibling.textContent = T.toFixed(2); });
    on('aT', 'onchange', () => buildSide());
    on('kAll', 'onclick', () => { pushUndo(); const { pose } = curPose(); for (const id of R.order) { const v = clip[0] === '+' ? clipVal(id) : Object.assign({ r: 0, x: 0, y: 0, s: 1 }, pose[id] || {}); setKey(id, v); } buildSide(); });
    on('kDel', 'onclick', () => { const K = selBone && c.k && c.k[selBone]; if (!K) return; pushUndo(); const i = K.findIndex(k => Math.abs(k[0] - T) < 0.02); if (i >= 0) K.splice(i, 1); else return status('На этом времени у кости нет ключа'); if (!K.length) delete c.k[selBone]; buildSide(); });
    on('kCopy', 'onclick', () => { copyPose = {}; for (const id of R.order) copyPose[id] = clipVal(id); status('Поза скопирована'); buildSide(); });
    on('kPaste', 'onclick', () => { if (!copyPose) return; pushUndo(); for (const id in copyPose) if (R.B[id]) setKey(id, copyPose[id]); buildSide(); });
    on('chM', 'onchange', e => { pushUndo(); setChKey('c', 'mouth', +e.target.value); buildSide(); }); on('chE', 'onchange', e => { pushUndo(); setChKey('c', 'eye', +e.target.value); buildSide(); });
    box.querySelectorAll('[data-var]').forEach(s => s.onchange = () => { pushUndo(); if (s.value) setChKey('v', s.dataset.var, s.value); else { const K = (c.v || {})[s.dataset.var]; if (K) { const i = K.findIndex(k => Math.abs(k[0] - T) < 0.02); if (i >= 0) K.splice(i, 1); } } buildSide(); });
    on('fLook', 'onchange', e => { pushUndo(); c.f.look = e.target.checked ? 1 : undefined; }); on('fGun', 'onchange', e => { pushUndo(); c.f.gun = e.target.checked ? 1 : undefined; });
    on('fShake', 'onchange', e => { pushUndo(); c.f.shake = e.target.checked ? 1 : undefined; }); on('fFront', 'onchange', e => { pushUndo(); c.f.front = e.target.checked ? 1 : undefined; }); on('ikV', 'onchange', e => { ikView = e.target.checked; }); on('fIk', 'onchange', e => { pushUndo(); c.f.ik = e.target.value || undefined; }); on('fHose', 'onchange', e => { pushUndo(); c.f.hose = e.target.value || undefined; });
    if (selBone) { const k = () => { pushUndo(); setKey(selBone, { r: +$('kR').value, x: +$('kX').value, y: +$('kY').value, s: +$('kS').value }); }; ['kR', 'kX', 'kY', 'kS'].forEach(id => on(id, 'onchange', k)); }
  } else if (tab === 'game') {
    on('gUse', 'onchange', e => { pushUndo(); D.use = e.target.checked; });
    for (const [id, k] of [['gX', 'x'], ['gY', 'y'], ['gH', 'H']]) on(id, 'oninput', e => { SEM[k] = +e.target.value; e.target.nextElementSibling.textContent = e.target.value; const P = gameP(); if (P && P.R) { P.R[k] = SEM[k]; try { const L = gw().L10.SEA3; L.sem[k] = SEM[k]; } catch (er) {} } });
    box.querySelectorAll('[data-atk]').forEach(b => b.onclick = () => { const P = gameP(); if (P && P.startAtk) P.startAtk(b.dataset.atk); else status('Игра ещё не загрузилась', 1); });
    on('gAuto', 'onclick', () => { const P = gameP(); if (!P) return; P.edit = !P.edit; if (!P.edit && P.A) P.A.cd = 1; status(P.edit ? 'Атаки только по кнопкам' : 'Авто-бой'); });
    on('gReload', 'onclick', reloadGame);
  }
}
// ---------- игра в iframe ----------
let SEM = { x: 320, y: 270, H: 236 }, gameReady = false;
const gw = () => { try { return { L10: $('ifr').contentWindow.eval('L10') }; } catch (e) { return null; } };
const gameP = () => { try { return $('ifr').contentWindow.eval("typeof L10 !== 'undefined' && L10.PARTS && L10.PARTS.sea") || null; } catch (e) { return null; } };
function reloadGame() { $('ifr').src = ROOT + 'index.html?l10=sea&t=' + Date.now(); }
async function readSem() { try { await loadScript(ROOT + 'js/sea3_layout.js'); const s = L10.SEA3 && L10.SEA3.sem; if (s) SEM = { x: s.x, y: s.y, H: s.H }; } catch (e) {} }
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => {
  tab = b.dataset.t; document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b)); lasso = null; addBone = null; hint('');
  if (tab === 'scene' && !W) loadGame(); buildSide(); setTimeout(resize, 0);
});

// ---------- сохранение ----------
function cleanData() { const d = JSON.parse(JSON.stringify(D)); for (const p of d.parts) delete p._hide; const used = new Set(d.parts.map(p => p.img)); return { d, used }; }
$('save').onclick = async () => {
  const { d, used } = cleanData(), images = {};
  for (const n of dirty) if (used.has(n) && IMG[n]) images[n] = IMG[n].toDataURL('image/png');
  status('Сохраняю…');
  try {
    let r = await (await fetch(SRV + '/save', { method: 'POST', body: JSON.stringify({ data: d, images, sem: LAY ? null : SEM }) })).json(); if (!r.ok) throw new Error(r.log);
    await saveScene();
    dirty.clear(); status('Сохранено. Сжимаю картинки и обновляю игру…');
    r = await (await fetch(SRV + '/build', { method: 'POST', body: '{}' })).json(); if (!r.ok) throw new Error(r.log);
    status('Готово, версия игры ' + r.ver + '. Вкладка «Сцена» — посмотреть.'); if (W) loadGame();
  } catch (e) { status('Ошибка сохранения: ' + e.message + ' (запущен ли «Редактор фазы 3.bat»?)', 1); }
};
window.addEventListener('beforeunload', e => { if (dirty.size || (typeof ED !== 'undefined' && ED && ED.dirty)) { e.preventDefault(); e.returnValue = ''; } });
readSem().then(boot).catch(e => status('Ошибка загрузки: ' + e.message, 1));
</script>
<script src="scene.js"></script>
